<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HERA</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' blob: data:;
                 media-src 'self' file: blob: data:;
                 script-src 'self';
                 connect-src 'self' https://*/ http://*/ file: data: blob:;">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      -webkit-app-region: drag;
      position: relative;
      width: 420px;
      height: 560px;
      background: radial-gradient(circle at 20% 20%, rgba(80,0,140,0.6) 0%, rgba(10,0,20,0.4) 70%);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.8),
        0 0 40px rgba(140,60,255,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .no-drag {
      -webkit-app-region: no-drag;
    }

    .top-area {
      position: relative;
      flex: 1;
      min-height: 300px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at 50% 20%, rgba(255,255,255,0.07) 0%, rgba(0,0,0,0) 60%);
      -webkit-app-region: no-drag;
      cursor: grab;
    }

    /* webcam preview box */
    #camPreview {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 90px;
      height: 68px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.4);
      object-fit: cover;
      display: none;
      -webkit-app-region: no-drag;
    }

    /* debug HUD bottom-left for head position/rotation/scale */
    #headDebugHUD {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.4;
      padding: 6px 8px;
      border-radius: 6px;
      pointer-events: none;
      user-select: none;
      white-space: pre-line;
    }

    /* mic/cam LEDs + presence/mood text */
    .status-overlay {
      position: absolute;
      left: 10px;
      top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
      -webkit-app-region: no-drag;
    }

    .led-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .led-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.4);
    }
    .led-dot.on.mic {
      background: #35ff6b;
      box-shadow: 0 0 8px #35ff6b;
      border-color: rgba(0,0,0,0.6);
    }
    .led-dot.on.cam {
      background: #ffa800;
      box-shadow: 0 0 8px #ffa800;
      border-color: rgba(0,0,0,0.6);
    }

    .presence-line,
    .mood-line {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.9);
    }

    /* TALK STATE PILL */
    .talk-state-pill {
      position: absolute;
      left: 10px;
      bottom: 60px;
      min-width: 90px;
      max-width: 160px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 999px;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.8),
        0 0 20px rgba(140,60,255,0.6);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      line-height: 1.4;
      text-align: center;
      padding: 6px 10px;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      -webkit-app-region: no-drag;
    }
    .talk-state-pill.listening {
      background: rgba(53,255,107,0.18);
      border-color: rgba(53,255,107,0.8);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.8),
        0 0 12px rgba(53,255,107,0.9),
        0 0 40px rgba(53,255,107,0.5);
      color: #baffc9;
    }
    .talk-state-pill.speaking {
      background: rgba(255,168,0,0.18);
      border-color: rgba(255,168,0,0.8);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.8),
        0 0 12px rgba(255,168,0,0.9),
        0 0 40px rgba(255,168,0,0.5);
      color: #ffe6a8;
    }
    .talk-state-pill.idle {
      opacity: 0.5;
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.7);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.8),
        0 0 20px rgba(140,60,255,0.4);
    }

    /* hint card (controls) */
    .hint-card {
      position: absolute;
      right: 10px;
      top: 10px;
      background: rgba(0,0,0,0.45);
      color: rgba(255,255,255,0.8);
      font-size: 10px;
      line-height: 1.4;
      font-family: ui-monospace, monospace;
      padding: 6px 8px;
      border-radius: 6px;
      pointer-events: none;
      user-select: none;
      text-align: right;
      -webkit-app-region: no-drag;
      white-space: pre-line;
    }

    .bottom-area {
      padding: 10px 12px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      grid-template-areas:
        "input say"
        "miccam miccam";
      row-gap: 10px;
      column-gap: 10px;
      -webkit-app-region: no-drag;
    }

    .chat-row {
      grid-area: input;
      display: flex;
      flex-direction: column;
    }

    label.chat-label {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      margin-bottom: 4px;
    }

    #chatText {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow:
        0 10px 30px rgba(0,0,0,0.8),
        0 0 20px rgba(140,60,255,0.4) inset;
      border-radius: 8px;
      height: 40px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      padding: 8px 10px;
      outline: none;
    }
    #chatText:focus {
      border-color: rgba(200,160,255,0.8);
      box-shadow:
        0 10px 30px rgba(0,0,0,0.8),
        0 0 30px rgba(160,80,255,0.8);
    }

    #sayBtn {
      grid-area: say;
      align-self: end;
      background: radial-gradient(circle at 20% 20%, rgba(200,140,255,0.9) 0%, rgba(100,0,200,0.9) 70%);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.8),
        0 0 20px rgba(200,140,255,0.9);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      min-width: 60px;
      cursor: pointer;
    }
    #sayBtn:active {
      transform: scale(0.97);
    }

    .miccam-row {
      grid-area: miccam;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .control-btn {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow:
        0 15px 30px rgba(0,0,0,0.8),
        0 0 20px rgba(140,60,255,0.6);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }
    .control-btn:active {
      transform: scale(0.97);
    }

  </style>
</head>
<body>

  <div class="app-shell">

    <div class="top-area">
      <canvas id="stage" class="no-drag"></canvas>
      <video id="camPreview" class="no-drag" autoplay muted playsinline></video>

      <div id="headDebugHUD" style="display: none;">
        pos: (0,0,0)
        rot: pitch 0, yaw 0
        scale: 0
      </div>

      <div class="status-overlay no-drag" id="overlayStatus">
        <div class="led-row">
          <div id="ledMic" class="led-dot"></div>
          <div>Mic</div>
        </div>
        <div class="led-row">
          <div id="ledCam" class="led-dot"></div>
          <div>Cam</div>
        </div>
        <div class="presence-line" id="presenceLabel">User: Away</div>
        <div class="mood-line" id="moodLabel">Mood: neutral</div>
      </div>

      <div id="talkStateIndicator" class="talk-state-pill no-drag idle">
        idle
      </div>

      <div class="hint-card" style="display: none;">
        Left drag = move
        Right drag / R+drag = rotate
        Scroll = resize
      </div>
    </div>

    <div class="bottom-area">
      <div class="chat-row">
        <label class="chat-label" for="chatText">Ask HERA</label>
        <input id="chatText" class="no-drag" placeholder="Type and press Enter..." />
      </div>

      <button style="display: none;" id="sayBtn" class="no-drag">Say</button>

      <div class="miccam-row">
        <div id="micToggle" class="control-btn no-drag">Mic OFF</div>
        <div id="camToggle" class="control-btn no-drag">Cam OFF</div>
      </div>
    </div>

  </div>

  <script type="module" src="./index.js"></script>
</body>
</html>
